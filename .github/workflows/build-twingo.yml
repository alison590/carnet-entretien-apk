name: Build Twingo APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'Twingo-Entretien-v*.zip'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decompresser
        run: unzip -oq "$(ls Twingo-Entretien-v*.zip | sort -V | tail -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'
      - name: Compiler
        run: |
          cd Twingo-Entretien
          gradle assembleDebug --no-daemon
          mkdir -p ../out
          cp "$(find . -name '*-debug.apk' | head -1)" ../out/Twingo-Entretien.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Twingo-Entretien-APK
          path: out/Twingo-Entretien.apk
